</radialGradient>
<radialGradient id="lblob3" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#378add" stop-opacity="0.3"/>
<stop offset="100%" stop-color="#378add" stop-opacity="0"/>
</radialGradient>
<linearGradient id="scrim" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#eef4fd" stop-opacity="0.85"/>
<stop offset="55%" stop-color="#eef4fd" stop-opacity="0.35"/>
<stop offset="100%" stop-color="#eef4fd" stop-opacity="0"/>
</linearGradient>
</defs>

