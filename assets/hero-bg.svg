<svg width="100%" viewBox="0 0 830 510" role="img" style="" xmlns="http://www.w3.org/2000/svg">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Reference hero background: light variant matching Skygentic palette</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A light blue-white background matching the current Skygentic site palette, with soft navy-blue gradient blobs and a faint agent network overlay, denser on the left where hero text would sit and fading toward the right.</desc>
<defs>
<linearGradient id="basel" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#eef4fd"/>
<stop offset="100%" stop-color="#dbe7f7"/>
</linearGradient>
<radialGradient id="lblob1" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#85b7eb" stop-opacity="0.55"/>
<stop offset="100%" stop-color="#85b7eb" stop-opacity="0"/>
</radialGradient>
<radialGradient id="lblob2" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#4d6f96" stop-opacity="0.35"/>
