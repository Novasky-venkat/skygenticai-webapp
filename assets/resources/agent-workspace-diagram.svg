<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1675 825" role="img" aria-labelledby="title desc">
  <title id="title">System agents workspace resource diagram</title>
  <desc id="desc">Diagram showing pre-fabricated agents, workspace agents, custom agents, and the resource documentation workspace containing documentation, versions, logs, and case studies.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10" fill="#1f6feb"/>
    </marker>
  </defs>
  <rect width="1675" height="825" rx="44" fill="#fff"/>
  <g fill="none" stroke="#1f6feb" stroke-width="3" marker-end="url(#arrow)" opacity=".7">
    <path d="M1000 225H558"/>
    <path d="M1100 225H1000"/>
    <path d="M812 305V520H552"/>
  </g>
  <g>
    <rect x="96" y="144" width="456" height="160" rx="18" fill="#fff" stroke="#1f6feb" stroke-width="4"/>
    <text x="324" y="213" text-anchor="middle" font-family="Clashdisplay, Arial, sans-serif" font-size="33" font-weight="700" fill="#0b2a57">Pre-fabricated agents</text>
    <text x="324" y="263" text-anchor="middle" font-family="Satoshi, Arial, sans-serif" font-size="30" font-weight="500" fill="#1f6feb">(PFA)</text>
  </g>
  <g>
    <rect x="624" y="144" width="378" height="160" rx="18" fill="#fff" stroke="#1f6feb" stroke-width="4"/>
    <text x="813" y="213" text-anchor="middle" font-family="Clashdisplay, Arial, sans-serif" font-size="33" font-weight="700" fill="#0b2a57">Workspace agent</text>
    <text x="813" y="263" text-anchor="middle" font-family="Satoshi, Arial, sans-serif" font-size="30" font-weight="500" fill="#1f6feb">(PFA+CA)</text>
  </g>
  <g>
    <rect x="96" y="440" width="456" height="160" rx="18" fill="#fff" stroke="#1f6feb" stroke-width="4"/>
    <text x="324" y="508" text-anchor="middle" font-family="Clashdisplay, Arial, sans-serif" font-size="33" font-weight="700" fill="#0b2a57">Custom agents</text>
    <text x="324" y="558" text-anchor="middle" font-family="Satoshi, Arial, sans-serif" font-size="30" font-weight="500" fill="#1f6feb">(CA)</text>
  </g>
  <g>
    <rect x="1100" y="92" width="498" height="620" rx="40" fill="#fff" stroke="#1f6feb" stroke-width="4"/>
    <text x="1349" y="163" text-anchor="middle" font-family="Clashdisplay, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f6feb">System agents</text>
    <text x="1349" y="207" text-anchor="middle" font-family="Clashdisplay, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f6feb">workspace</text>
    <rect x="1176" y="280" width="344" height="320" rx="18" fill="#fff" stroke="#1f6feb" stroke-width="3"/>
    <g font-family="Satoshi, Arial, sans-serif" font-size="29" fill="#0b2a57">
      <circle cx="1223" cy="336" r="5" fill="#1f6feb"/>
      <text x="1244" y="346">Documentation</text>
      <circle cx="1223" cy="400" r="5" fill="#1f6feb"/>
      <text x="1244" y="410">Versions</text>
      <circle cx="1223" cy="465" r="5" fill="#1f6feb"/>
      <text x="1244" y="475">Logs</text>
      <circle cx="1223" cy="529" r="5" fill="#1f6feb"/>
      <text x="1244" y="539">Case studies</text>
    </g>
  </g>
</svg>
