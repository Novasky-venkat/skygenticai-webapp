<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 1675 725" role="img" aria-labelledby="title desc">
  <title id="title">System agents workspace resource diagram</title>
  <desc id="desc">Diagram showing pre-fabricated agents, workspace agents, custom agents, and the resource workspace containing documentation, versions, and operations.</desc>
  <defs>
    <filter id="cardShadow" x="-12%" y="-22%" width="124%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0b5fe8" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="3" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M11 1 2 6l9 5" fill="none" stroke="#1269ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g fill="none" stroke="#a8ccff" stroke-width="2" stroke-dasharray="10 16" opacity="0.48">
    <path d="M512 412H1068"/>
    <path d="M834 124V684"/>
    <ellipse cx="836" cy="412" rx="360" ry="278"/>
  </g>

  <g fill="none" stroke="#1269ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 12" marker-end="url(#arrow)" opacity=".82">
    <path d="M1000 225H558"/>
    <path d="M1100 225H1000"/>
    <path d="M812 305V520H552"/>
  </g>

  <g fill="#1269ff">
    <circle cx="558" cy="225" r="7"/>
    <circle cx="1000" cy="225" r="7"/>
    <circle cx="1100" cy="225" r="7"/>
    <circle cx="812" cy="305" r="7"/>
    <circle cx="812" cy="520" r="7"/>
    <circle cx="552" cy="520" r="7"/>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="96" y="144" width="456" height="160" rx="34" fill="#ffffff" stroke="#c8e0ff" stroke-width="2"/>
    <text x="324" y="213" text-anchor="middle" font-family="Clashdisplay, Arial, sans-serif" font-size="33" font-weight="700" fill="#07163d">Pre-fabricated agents</text>
    <text x="324" y="263" text-anchor="middle" font-family="Satoshi, Arial, sans-serif" font-size="30" font-weight="500" fill="#1269ff">(PFA)</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="624" y="144" width="378" height="160" rx="34" fill="#ffffff" stroke="#c8e0ff" stroke-width="2"/>
    <text x="813" y="213" text-anchor="middle" font-family="Clashdisplay, Arial, sans-serif" font-size="33" font-weight="700" fill="#07163d">Workspace agent</text>
    <text x="813" y="263" text-anchor="middle" font-family="Satoshi, Arial, sans-serif" font-size="30" font-weight="500" fill="#1269ff">(PFA+CA)</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="96" y="440" width="456" height="160" rx="34" fill="#ffffff" stroke="#c8e0ff" stroke-width="2"/>
    <text x="324" y="508" text-anchor="middle" font-family="Clashdisplay, Arial, sans-serif" font-size="33" font-weight="700" fill="#07163d">Custom agents</text>
    <text x="324" y="558" text-anchor="middle" font-family="Satoshi, Arial, sans-serif" font-size="30" font-weight="500" fill="#1269ff">(CA)</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="1100" y="144" width="380" height="456" rx="36" fill="#ffffff" stroke="#c8e0ff" stroke-width="2"/>
    <text x="1290" y="213" text-anchor="middle" font-family="Clashdisplay, Arial, sans-serif" font-size="34" font-weight="700" fill="#1269ff">System agents</text>
    <text x="1290" y="255" text-anchor="middle" font-family="Clashdisplay, Arial, sans-serif" font-size="34" font-weight="700" fill="#1269ff">workspace</text>
    <rect x="1150" y="303" width="280" height="244" rx="24" fill="#ffffff" stroke="#c8e0ff" stroke-width="2"/>
    <g font-family="Satoshi, Arial, sans-serif" font-size="27" fill="#07163d">
      <circle cx="1183" cy="353" r="7" fill="#1269ff"/>
      <text x="1204" y="363">Documentation</text>
      <circle cx="1183" cy="415" r="7" fill="#1269ff"/>
      <text x="1204" y="425">Versions</text>
      <circle cx="1183" cy="477" r="7" fill="#1269ff"/>
      <text x="1204" y="487">Operate</text>
    </g>
  </g>
</svg>
