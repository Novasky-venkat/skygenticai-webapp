  <style>
    /* Hallmark · genre: modern-minimal · macrostructure: Marquee Hero · theme: Skygentic Cobalt Light · tone: technical · anchor hue: cobalt */
    @font-face {
      font-family: 'Clashdisplay';
      src: url('https://cdn.prod.website-files.com/677ca44598d8bae2633f6b99/677ca44598d8bae2633f6bee_ClashDisplay-Medium.ttf') format('truetype');
      font-weight: 500 700;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Satoshi';
      src: url('https://cdn.prod.website-files.com/677ca44598d8bae2633f6b99/677ca44598d8bae2633f6bf6_Satoshi-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Satoshi';
      src: url('https://cdn.prod.website-files.com/677ca44598d8bae2633f6b99/677ca44598d8bae2633f6bf5_Satoshi-Medium.ttf') format('truetype');
      font-weight: 500 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --color-blue-50: oklch(97% .018 250);
      --color-blue-100: oklch(94% .035 250);
      --color-blue-900: oklch(29% .08 258);
      --color-primary-blue: oklch(53% .2 258);
      --color-secondary-blue: oklch(70% .14 250);
      --color-cyan-blue: oklch(73% .15 226);
      --color-background: oklch(98% .01 250);
      --color-card: oklch(99% .006 250);
      --color-border: oklch(88% .02 250);
      --color-heading: oklch(19% .025 255);
      --color-body: oklch(34% .025 252);
      --color-secondary-text: oklch(45% .025 252);
      --color-grid-line: oklch(53% .2 258 / .09);
      --color-grid-line-soft: oklch(73% .15 226 / .08);
      --color-cobalt-wash: oklch(53% .2 258 / .12);
      --color-cyan-wash: oklch(73% .15 226 / .16);
      --color-ice-wash: oklch(94% .035 250 / .52);
      --color-shadow: oklch(19% .025 255 / .08);
      --color-button-shadow: oklch(53% .2 258 / .26);
      --color-button-shadow-hover: oklch(47% .18 258 / .32);
      --font-family-display: 'Clashdisplay', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-family-body: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-10: 40px;
      --space-12: 48px;
      --space-16: 64px;
      --space-20: 80px;
      --space-24: 96px;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-pill: 3rem;
      --ease-out: cubic-bezier(.16, 1, .3, 1);
      --ease-in: cubic-bezier(.7, 0, .84, 0);
      --ease-in-out: cubic-bezier(.65, 0, .35, 1);
      --transition-fast: 150ms var(--ease-out);
      --transition-normal: 300ms var(--ease-out);
      --focus-ring-color: var(--color-primary-blue);
      --focus-ring-offset: 3px;
      --bg-page: radial-gradient(ellipse 720px 540px at 50% 24%, var(--color-ice-wash) 0%, transparent 72%),
        radial-gradient(ellipse 680px 520px at 18% 78%, var(--color-cobalt-wash) 0%, transparent 76%),
        radial-gradient(ellipse 720px 520px at 86% 70%, var(--color-cyan-wash) 0%, transparent 76%),
        linear-gradient(180deg, var(--color-background) 0%, var(--color-blue-50) 100%);
      --bg-grid: linear-gradient(var(--color-grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--color-grid-line-soft) 1px, transparent 1px);
      --bg-button: linear-gradient(135deg, var(--color-primary-blue) 0%, var(--color-blue-900) 100%);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      overflow-x: clip;
      min-height: 100%;
      background: var(--color-background);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      min-height: 100%;
      margin: 0;
      overflow-x: clip;
      background: var(--color-background);
      color: var(--color-body);
      font-family: var(--font-family-body);
    }

    .coming-soon-page {
      position: relative;
      isolation: isolate;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: clip;
      background: var(--bg-page);
    }

    .coming-soon-page::before,
    .coming-soon-page::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: -2;
    }

    .coming-soon-page::before {
      background-image: var(--bg-grid);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 72% 70% at 50% 44%, black 0%, transparent 78%);
      opacity: .62;
    }

    .coming-soon-page::after {
      inset: auto 0 0;
      height: 42%;
      background: linear-gradient(180deg, transparent 0%, var(--color-background) 100%);
      z-index: -1;
    }

    .skip-link {
      position: fixed;
      top: -999px;
      left: 50%;
      z-index: 10;
      transform: translateX(-50%);
      min-height: var(--space-12);
      display: inline-flex;
      align-items: center;
      padding: 0 var(--space-6);
      border-radius: var(--radius-pill);
      background: var(--color-primary-blue);
      color: var(--color-card);
      font-weight: 700;
      text-decoration: none;
    }

    .skip-link:focus {
      top: var(--space-4);
      outline: 2px solid var(--color-heading);
      outline-offset: 2px;
    }

    .coming-soon-header {
      width: min(100%, 1320px);
      margin-inline: auto;
      padding: var(--space-6);
    }

    .brand-link {
      display: inline-flex;
      align-items: center;
      min-height: var(--space-12);
      color: var(--color-heading);
      text-decoration: none;
    }

    .brand-link:focus-visible,
    .home-button:focus-visible,
    .assist-link:focus-visible {
      outline: 2px solid var(--focus-ring-color);
      outline-offset: var(--focus-ring-offset);
    }

    .brand-wordmark {
      display: block;
      width: clamp(168px, 18vw, 250px);
      height: auto;
    }

    .coming-soon-main {
      display: grid;
      place-items: center;
      min-width: 0;
      padding: var(--space-8) var(--space-6) var(--space-20);
    }

    .coming-soon-content {
      position: relative;
      width: min(100%, 680px);
      min-width: 0;
      display: grid;
      justify-items: center;
      gap: var(--space-6);
      padding: clamp(var(--space-8), 5vw, var(--space-16)) 0;
      text-align: center;
    }

    .status-indicator {
      display: block;
      min-height: auto;
      padding: 0;
      color: var(--color-secondary-text);
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .08em;
      line-height: 1;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .coming-soon-network {
      position: absolute;
      inset: clamp(var(--space-1), 1vw, var(--space-3)) auto auto 50%;
      width: min(92vw, 760px);
      height: auto;
      transform: translateX(-50%);
      color: var(--color-primary-blue);
      opacity: .2;
      z-index: -1;
      animation: networkDrift 8s var(--ease-in-out) infinite alternate;
    }

    .coming-soon-title {
      max-width: 11ch;
      margin: 0;
      color: var(--color-heading);
      font-family: var(--font-family-display);
      font-size: clamp(2.65rem, 7vw, 5.25rem);
      font-style: normal;
      font-weight: 500;
      letter-spacing: 0;
      line-height: 1.04;
      overflow-wrap: anywhere;
    }

    .coming-soon-copy {
      max-width: 58ch;
      margin: 0;
      color: var(--color-body);
      font-size: clamp(1rem, 1.6vw, 1.125rem);
      line-height: 1.62;
    }

    .home-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      min-height: var(--space-12);
      max-width: 100%;
      padding: var(--space-2) var(--space-6);
      border: 0;
      border-radius: var(--radius-pill);
      background: var(--bg-button);
      box-shadow: 0 4px 14px var(--color-button-shadow);
      color: var(--color-card);
      font-family: var(--font-family-body);
      font-size: .9375rem;
      font-weight: 700;
      line-height: 1.2;
      text-decoration: none;
      white-space: nowrap;
      transition: background-color var(--transition-fast), box-shadow var(--transition-fast), transform var(--transition-fast);
    }

    .home-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px var(--color-button-shadow-hover);
    }

    .home-button:active {
      transform: translateY(0);
    }

    .home-button__arrow {
      font-size: 1.1em;
      line-height: 1;
    }

    .assist-copy {
      margin: calc(-1 * var(--space-2)) 0 0;
      color: var(--color-secondary-text);
      font-size: .9375rem;
      line-height: 1.5;
    }

    .assist-link {
      color: var(--color-primary-blue);
      font-weight: 700;
      text-decoration: none;
      text-underline-offset: var(--space-1);
      transition: color var(--transition-fast);
    }

    .assist-link:hover {
      color: var(--color-blue-900);
      text-decoration: underline;
    }

    @keyframes networkDrift {
      to {
        opacity: .28;
        transform: translateX(-50%) translateY(calc(-1 * var(--space-2)));
      }
    }

    @media (max-width: 48rem) {
      .coming-soon-header {
        padding: var(--space-5) var(--space-4);
      }

      .coming-soon-main {
        padding: var(--space-4) var(--space-4) var(--space-16);
      }

      .coming-soon-content {
        gap: var(--space-5);
        padding-block: var(--space-10);
      }

      .coming-soon-network {
        width: 124vw;
      }
    }

    @media (max-width: 26rem) {
      .coming-soon-header {
        padding-inline: var(--space-4);
      }

      .brand-wordmark {
        width: 154px;
      }

      .coming-soon-main {
        padding-inline: var(--space-3);
      }

      .coming-soon-content {
        padding-inline: 0;
      }

      .status-indicator {
        max-width: 100%;
        font-size: .6875rem;
        letter-spacing: .06em;
      }

      .coming-soon-title {
        font-size: clamp(2.25rem, 14vw, 3rem);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

          <g fill="currentColor">

            <circle cx="112" cy="98" r="3" />
            <circle cx="390" cy="112" r="4" />

          </g>
        </svg>

        <p class="status-indicator" aria-label="Workspace access coming soon">

        <h1 id="coming-soon-title" class="coming-soon-title">Your AI Workspace Is Coming Soon</h1>

        <a class="home-button" href="index.html" aria-label="Back to Skygentic AI home">
          <span class="home-button__arrow" aria-hidden="true">&larr;</span>
          <span>Back to Home</span>
        </a>

        <p class="assist-copy">Need assistance? <a class="assist-link" href="get-in-touch.html">Contact Us</a></p>
      </section>
    </main>
  </div>
</body>

</html>
